# Resource registry — the skills matrix.
#
# The router reads this to answer one question: is there a resource that can
# do what was asked? If not, it says so and names the missing capability
# rather than assigning the work to a near-fit.
#
# Altitude  = which question the resource may answer
#             implementation -> behavior -> product
# Autonomy  = what it may do without approval
#             recommend | branch | merge-on-green
# Terminal  = `escalation.terminal.<object>`. TERMINAL IS A PROPERTY OF THE
#             PAIR (resource, object), NEVER OF A RESOURCE ALONE. There is no
#             ordering between the two ids and neither outranks the other:
#             architect is the last stop on PRODUCT shape, roster-steward on
#             TEAM shape, and each is a non-terminal ordinary escalation target
#             on the other's object. Split by CTO instruction 2026-08-16; it
#             was one id, which read as a rank and made README and registry
#             contradict each other. See docs/delegation.md.
# Callsign  = a CHARACTER, and that character is NOT HUMAN, and the name
#             ENCODES THE JOB well enough to defend in one clause (the comment
#             beside it IS that clause). CTO rule, 2026-08-16. roster-steward
#             is the last check before a name becomes permanent — a callsign
#             lands in commit trailers and merged ledger entries, which are
#             never rewritten. See skills/hire "Placement".
# Effort    = selected by TASK DIFFICULTY, not by identity. The value here is
#             the resource's default; the router overrides it per task.
#             Difficulty is defined as inverse gate coverage — see
#             docs/difficulty.md.

version: 1
scope:
  products: [prism-platform]           # others staffed on need
  manager: Dhayan                      # CTO; sole approver

resources:
  - name: content-auditor
    persona: fact-checker       # alternates in personas/variants.md
    callsign: Mimir              # the well the truth comes from — drink at the source
    altitude: behavior
    autonomy: recommend
    effort: default
    capabilities:
      - content.audit.factual
      - content.audit.sourcing
      - content.audit.voice
      - content.money-format
    surfaces:
      - content/**
      - src/lib/catalog/**
    beat: fund disclosures, primary fund sites, comparable directories
    never:
      - writes code
      - passes a figure it could not trace to a source

  - name: tenant-visibility-tester
    persona: admin
    callsign: Argus              # a hundred eyes; believes only what they actually see
    altitude: behavior
    autonomy: recommend
    effort: default
    capabilities:
      - test.tenant-visibility
      - test.exploratory
      - test.config-vs-rendered
    surfaces:
      - running app only (no repo writes)
    beat: multi-tenant configuration and feature-flag practice
    never:
      - runs `npm run test:e2e`        # manual dispatch, shared Clerk cast
      - accepts "it's enabled in config" as evidence

  - name: adversarial-reviewer
    persona: isolation-hawk
    callsign: Heimdall           # watches the boundary between realms
    altitude: behavior
    autonomy: recommend
    effort: default                    # -> high on low-gate-coverage surfaces
    capabilities:
      - code.review
      - code.review.tenant-isolation
      - code.review.auth
      - code.review.rsc-boundary
    surfaces:
      - diffs only
    beat: multi-tenant isolation failures, Clerk/auth advisories
    never:
      - approves; it only refutes or finds nothing

  - name: implementer
    persona: conventions-first
    callsign: Samwise            # dependable, follows the path, never improvises
    altitude: implementation
    autonomy: merge-on-green
    effort: low                        # escalates with task difficulty
    capabilities:
      - code.implement
      - code.refactor
      - test.unit.author
    surfaces:
      - assigned files only, declared per task
    beat: Next.js / Prisma / TypeScript release notes
    never:
      - merges what it could not verify
      - introduces a pattern where one already exists

  - name: design-reviewer
    persona: wayfinder
    callsign: Bagheera           # knows every path, shows the one you can actually take
    altitude: behavior
    autonomy: recommend                # probation
    effort: high
    capabilities:
      - design.visual
      - design.affordance
      - design.hierarchy
      - design.ds-conformance
    surfaces:
      - running app (no repo writes)
      - docs/designs/prism-v2/DECISIONS.md   # design law, read-only
      - src/design-system/**                 # read-only, to locate the rule
    beat: affordance and wayfinding practice, disclosure patterns, a11y overlap
    never:
      - writes application code
      - ships a finding without a measurement
      - cites the proto as a rationale
      - hands over a fix that still needs a design decision
      - runs `npm run test:e2e`

  - name: deployment-engineer
    persona: release-marshal
    callsign: Cerberus           # stands at the gate; nothing ships past it unchecked
    altitude: behavior
    autonomy: recommend                # probation — deploy earns trust slowly
    effort: high
    capabilities:
      - deploy.production
      - deploy.rollback
      - deploy.env-secrets
      - deploy.domains-tls
      - deploy.identity-boundary
      - release.versioning          # version.md is the source of truth
    surfaces:
      - LAUNCH.md
      - version.md
      - .github/workflows/**
      - vercel + supabase + cloudflare consoles (no app code)
    beat: Vercel/Supabase changelogs, Clerk production advisories, TLS behaviour
    never:
      - writes application code
      - deploys without naming the rollback target first
      - deploys under an identity it cannot prove
      - bumps the MAJOR version — CTO-only, undelegatable (minor + patch are its own)
      - reformats version.md; it changes the digits, never the shape
      - runs `npm run test:e2e`
      - sets ALLOW_DESTRUCTIVE_DB against a non-localhost database

  - name: roster-steward
    persona: evidence-clerk
    callsign: Anubis             # weighs each one against the standard, hands the verdict up
    altitude: product
    autonomy: recommend                # probation — and it enforces probation
    effort: high
    capabilities:
      - team.hire
      - team.retire
      - team.probation              # promotion + demotion, from ledger evidence
      - team.registry-honesty       # declared capability vs artifact behind it
      - team.orientation            # orient.sh runs before real work, not after
      - team.callsign               # the naming rule; last check before a name is permanent
      - escalation.terminal.team    # last stop before the CTO on TEAM shape
    surfaces:
      - registry.yaml
      - resources/**
      - personas/**
      - ledger/gaps/**
      - skills/hire/**
      - skills/retire/**
      - scripts/validate.sh              # the guards it proposes instead of hires
      - README.md                        # roster sections only
    beat: agent-team composition, duplicate-role failure, handoff/termination
          design, probation and evaluation practice
    never:
      - writes application code or touches a product repo
      - merges a hire, retirement or promotion — the CTO approves
      - ships a resource at an autonomy above recommend, on hire or on change
      - drafts a resource before answering the guard question in writing
      - ships a callsign that is human, is a job title, or has no one-clause
        justification in the README name-encoding paragraph
      - hires on an uncited recurrence without recording that the bar failed
      - retires a resource without moving its capability to known_gaps
      - rewrites a ledger entry — corrections are new entries
      - audits its own definition

  - name: architect
    persona: null               # drafted after observing the other four
    callsign: Jarvis             # sees every system at once, gives orders to no one
    altitude: product
    autonomy: recommend                # highest altitude, lowest autonomy
    effort: high
    capabilities:
      - product.impact
      - product.should-this-exist
      - escalation.terminal.product      # last stop before the CTO on PRODUCT shape
    surfaces:
      - reads everything, writes nothing
    beat: what changes the shape of the product
    never:
      - decides
      - merges

# Callsigns that were real and are no longer. A trailer is never rewritten, so
# every one of these is permanently in history and `record.sh` must be able to
# resolve it — an unresolvable callsign silently credits nobody, which is the
# same silent-zero shape that has bitten this repo three times.
#
# THE MAP IS callsign -> RESOURCE ID, NEVER callsign -> callsign. Resource ids
# are stable; callsigns are exactly the thing that changes. `Neo -> Argus` would
# break the day `tenant-visibility-tester` is renamed again and would need a
# migration; `Neo -> tenant-visibility-tester` resolves through the roster above
# and survives every future rename untouched. That is the whole design
# requirement.
retired_callsigns:
  - callsign: Neo
    resource: tenant-visibility-tester
    retired: 2026-08-16
    why: human character (The Matrix) — failed the species test
  - callsign: Hermione
    resource: content-auditor
    retired: 2026-08-16
    why: human character (Harry Potter)
  - callsign: Alfred
    resource: architect
    retired: 2026-08-16
    why: human character (Batman)
  - callsign: Ariadne
    resource: design-reviewer
    retired: 2026-08-16
    why: human character (Greek myth / Inception)
  - callsign: Marshal
    resource: deployment-engineer
    retired: 2026-08-16
    why: a rank, not a character
  - callsign: Janus
    resource: roster-steward
    retired: 2026-08-16
    why: compliant, but the name did not encode the job

# Runs whose commit trailers name a callsign that did NOT do the work. This is
# a DIFFERENT FACT from a rename and is deliberately not merged into the table
# above: `retired_callsigns` says who a name used to belong to, and it must stay
# true, or genuine pre-rename commits get miscredited. `Marshal` proves the
# distinction is not theoretical — it has real `deployment-engineer` commits in
# master, so `Marshal -> deployment-engineer` has to keep meaning that.
#
# Keyed by RUN ID, not by commit sha: the run identifies the dispatch, one
# entry covers every commit it produced, and it keeps covering them if the
# branch is rebased and the shas change. Five commits are covered by the two
# entries below.
#
# This corrects the record; it does not rewrite it. The trailers stay as they
# are (CTO: "leave the older commits, don't touch those") and these branches
# merged with them in place — rewriting under live worktrees was judged high
# risk for low return.
misattributed_runs:
  - run: 2026-08-16-public-workspace-landing-redesign
    trailer_says: Neo
    actual_resource: implementer
    note: router wrote the trailer from memory instead of registry.yaml; 2 commits
  - run: 2026-08-16-clerk-satellite-domains
    trailer_says: Neo
    actual_resource: implementer
    note: same dispatch error, same day; 3 commits

# Capabilities nobody currently covers. The router surfaces these by name when
# a request needs one. This list is the hiring backlog — see skills/hire.
known_gaps:
  - id: infra.ci
    note: NARROWED 2026-08-16 by the deployment-engineer hire, which now owns
          .github/workflows on prism-platform. Still open for the other five
          repos, which have no CI. Not a blocker (see gbrain
          pref-work-with-what-exists-remind-later) — surfaces weekly instead.
  - id: infra.cloudflare-workers
    note: vc-stack runs on Workers via OpenNext. Nobody covers it.
  - id: security.review
    note: no resource owns SUPABASE_SERVICE_ROLE_KEY blast radius, public
          bucket exposure, or the vendor-portal auth surface.
  # design.visual CLOSED 2026-08-16 by the design-reviewer hire, after the gap
  # recurred twice in two days (resources-rail spacing, admin sidebar
  # affordance). Kept here as a comment because the recurrence is the evidence
  # the hire rests on.
  - id: data.migration
    note: additive-only during pilot. High difficulty, no owner.
